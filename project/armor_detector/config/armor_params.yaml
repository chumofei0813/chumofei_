# ============================================================================
# armor_detector 参数配置文件
# ============================================================================
# 使用方式：ros2 launch 时自动加载，或运行时通过 ros2 param 动态修改
# 参数文件入口：config/armor_params.yaml
#
# 参数分组：
#   1. 基础设置（话题名、调试开关）
#   2. 颜色分离（HSV 阈值、Gamma 矫正）
#   3. 形态学处理（颜色 mask、最终 mask）
#   4. 灯条筛选（面积、长宽比、角度）
#   5. 灯条配对（角度差、高度差、间距）
#   6. 装甲板验证（宽高比）
#   7. 数字识别（模型路径、置信度阈值）
# ============================================================================

armor_detector_node:
  ros__parameters:
    # ========================================================================
    # 1. 基础设置
    # ========================================================================
    image_topic: "/image_raw"       # 订阅的图像话题名
    debug: true                     # 是否发布调试图像（/armor_debug_image）
    debug_level: 2                  # 调试详细等级：
                                    #   0 = 关闭，不发布调试图像
                                    #   1 = 仅装甲板框 + 标签
                                    #   2 = + 灯条候选框 + 配对连线
                                    #   3 = + 颜色 mask 叠加
    publish_endpoints: false        # 是否发布灯条端点（/armor_endpoints）

    # ========================================================================
    # 2. 颜色分离
    # ========================================================================

    # --- Gamma 矫正（1.0 = 不矫正，<1 提亮暗部，>1 压暗亮部）---
    gamma: 1.0

    # --- 红色 HSV 阈值 ---
    # H 通道红色分布在两端，需要两个区间取并集
    red_h_low1: 0                   # 红色区间1 H 下限
    red_h_high1: 30                 # 红色区间1 H 上限
    red_h_low2: 170                 # 红色区间2 H 下限
    red_h_high2: 180                # 红色区间2 H 上限
    red_s_low: 50                   # 红色 S 下限（饱和度，越高越鲜艳）
    red_v_low: 30                   # 红色 V 下限（亮度，越低对暗红越敏感）

    # --- 蓝色 HSV 阈值 ---
    blue_h_low: 70                  # 蓝色 H 下限
    blue_h_high: 140                # 蓝色 H 上限
    blue_s_low: 120                 # 蓝色 S 下限（蓝色需更高饱和度以抗干扰）
    blue_v_low: 50                  # 蓝色 V 下限

    # ========================================================================
    # 3. 形态学处理
    # ========================================================================

    # --- 颜色 mask 形态学（先闭后开）---
    # 闭运算填充孔洞，开运算去除噪点
    morph_color_close_size: 7       # 颜色 mask 闭运算核大小（奇数，越大填充越强）
    morph_color_open_size: 1        # 颜色 mask 开运算核大小（奇数，越大去噪越强）

    # --- 过曝提取（利用 V 通道辅助过滤高亮区域）---
    use_overexpose: true           # 是否启用过曝提取
    overexpose_thresh: 200          # V 通道阈值（0-255），高于此值视为过曝

    # --- 最终 mask 形态学（先闭后开）---
    morph_final_close_size: 1       # 最终 mask 闭运算核大小（1 = 不处理）
    morph_final_open_size: 1        # 最终 mask 开运算核大小（1 = 不处理）

    # ========================================================================
    # 4. 灯条筛选
    # ========================================================================
    light_area_min: 5.0             # 最小轮廓面积（像素²）
    light_area_max: 50000.0         # 最大轮廓面积（像素²）
    light_ratio_min: 2.0            # 最小长宽比（h/w < 此值视为非灯条）
    light_ratio_max: 20.0           # 最大长宽比（h/w > 此值视为非灯条）
    light_angle_max_diff: 30.0      # 长边角度与竖直(90°)的最大允许偏差（度）
    light_fill_ratio_min: 0.5       # 矩形填充率下限（轮廓面积/外接矩形面积，<此值视为非灯条）

    # ========================================================================
    # 5. 灯条配对
    # ========================================================================
    pair_ang_diff_max: 30.0         # 最大角度差（度），两灯条的角度差不能超过此值
    pair_h_diff_max: 0.6            # 最大高度相对差（比例），|h1-h2|/max(h1,h2) 的上限
    pair_dy_ratio_max: 0.8          # 最大垂直间距比（dy/avg_height），太大说明一高一低
    pair_dx_ratio_min: 0.8          # 最小水平间距比（dx/avg_height），太小说明重叠
    pair_dx_ratio_max: 5.0          # 最大水平间距比（dx/avg_height），太大说明太远

    # ========================================================================
    # 6. 装甲板验证
    # ========================================================================
    armor_ratio_min: 0.7            # 最小装甲板宽高比（宽度/平均灯条高度）
    armor_ratio_max: 5.0            # 最大装甲板宽高比

    # ========================================================================
    # 7. 数字识别
    # ========================================================================
    model_path: ""                  # ONNX 模型文件路径，留空则使用包内默认路径
    classify_conf_thresh: 0.5       # 分类置信度阈值（0-1），低于此值结果不可靠
    classify_vertical_extend_ratio: 0.6  # ROI 竖直方向外扩比例（0=不外扩，越大裁剪范围越大）
    classify_side_trim_ratio: 0.1      # ROI 水平方向灯条裁剪比例（0=不裁，越大裁越多）
